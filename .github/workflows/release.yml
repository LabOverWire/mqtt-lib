name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Publish to crates.io
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Verify version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep "^version" crates/mqtt5/Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish mqtt5-protocol to crates.io
        run: scripts/publish-crate.sh mqtt5-protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish mqtt5 library to crates.io
        run: scripts/publish-crate.sh mqtt5
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish mqtt5-wasm to crates.io
        run: scripts/publish-crate.sh mqtt5-wasm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish mqttv5-cli to crates.io
        run: scripts/publish-crate.sh mqttv5-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if npm publish is needed
        id: npm-check
        run: |
          LOCAL_VERSION=$(grep '^version' crates/mqtt5-wasm/Cargo.toml | head -1 | cut -d'"' -f2)
          if output=$(npm view "mqtt5-wasm@$LOCAL_VERSION" version 2>&1); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "mqtt5-wasm $LOCAL_VERSION already published to npm, skipping"
          elif echo "$output" | grep -q "code E404"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            exit 1
          fi

      - name: Install Rust
        if: steps.npm-check.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        if: steps.npm-check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm with trusted publishing support
        if: steps.npm-check.outputs.skip == 'false'
        run: npm install -g npm@^11.5.1

      - name: Build WASM package
        if: steps.npm-check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.npm-check.outputs.version }}
        run: |
          cargo build --target wasm32-unknown-unknown --release -p mqtt5-wasm --features client,broker,codec
          bindgen_version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$bindgen_version"
          cargo install wasm-bindgen-cli --version "$bindgen_version" --locked
          mkdir -p pkg
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/mqtt5_wasm.wasm
          cat > pkg/package.json << PKGJSON
          {
            "name": "mqtt5-wasm",
            "type": "module",
            "version": "$VERSION",
            "description": "MQTT v5.0 WebAssembly client and broker for browser environments",
            "license": "MIT OR Apache-2.0",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/LabOverWire/mqtt-lib.git"
            },
            "files": [
              "mqtt5_wasm_bg.wasm",
              "mqtt5_wasm.js",
              "mqtt5_wasm.d.ts",
              "mqtt5_wasm_bg.wasm.d.ts",
              "LICENSE-MIT",
              "LICENSE-APACHE-2.0"
            ],
            "main": "mqtt5_wasm.js",
            "types": "mqtt5_wasm.d.ts",
            "sideEffects": [
              "./mqtt5_wasm.js"
            ],
            "keywords": ["mqtt", "wasm", "webassembly", "iot", "pubsub"]
          }
          PKGJSON
          cp crates/mqtt5-wasm/README.md crates/mqtt5-wasm/LICENSE-MIT crates/mqtt5-wasm/LICENSE-APACHE-2.0 pkg/

      - name: Publish to npm
        if: steps.npm-check.outputs.skip == 'false'
        working-directory: pkg
        run: npm publish --access public

  # Build CLI binaries
  build-binaries:
    name: Build CLI Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mqttv5
            asset_name: mqttv5-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: mqttv5
            asset_name: mqttv5-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mqttv5
            asset_name: mqttv5-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mqttv5.exe
            asset_name: mqttv5-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --package mqttv5-cli --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  # Create GitHub release
  create-release:
    name: Create GitHub Release
    needs: [publish, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[mqtt5 " ver "\\]" {capture=1; print; next}
            capture && /^## \[mqtt5 / {exit}
            capture {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release_notes.md
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
