name: Conformance Suite

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  inprocess:
    name: Conformance (in-process fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build conformance CLI
        run: cargo build --profile conformance -p mqtt5-conformance-cli

      - name: Run conformance suite (in-process)
        run: ./target/conformance/mqtt5-conformance --report conformance-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report-inprocess
          path: conformance-report.json
          if-no-files-found: error

  external-mqtt5:
    name: Conformance (external mqtt5 broker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build mqttv5 broker
        run: cargo build --release -p mqttv5-cli

      - name: Build conformance CLI
        run: cargo build --profile conformance -p mqtt5-conformance-cli

      - name: Start mqttv5 broker
        run: |
          ./target/release/mqttv5 broker \
            --host 127.0.0.1:1883 \
            --allow-anonymous true \
            --storage-backend memory \
            > broker.log 2>&1 &
          echo $! > broker.pid
          sleep 2

      - name: Run conformance suite against external broker
        run: |
          ./target/conformance/mqtt5-conformance \
            --sut crates/mqtt5-conformance/tests/fixtures/external-mqtt5.toml \
            --report conformance-report.json

      - name: Stop broker
        if: always()
        run: |
          if [ -f broker.pid ]; then
            kill "$(cat broker.pid)" || true
          fi

      - name: Upload broker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-log-external-mqtt5
          path: broker.log
          if-no-files-found: ignore

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report-external-mqtt5
          path: conformance-report.json
          if-no-files-found: error

  mosquitto-interop:
    name: Conformance (Mosquitto interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build conformance CLI
        run: cargo build --profile conformance -p mqtt5-conformance-cli

      - name: Start Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo systemctl stop mosquitto
          mosquitto -h | head -1
          printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > mosquitto.conf
          nohup mosquitto -c mosquitto.conf -v > mosquitto.log 2>&1 &
          for i in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1883' 2>/dev/null; then
              echo "mosquitto ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "mosquitto did not become ready in time" >&2
          cat mosquitto.log || true
          exit 1

      - name: Run deferred-ack conformance against Mosquitto
        run: |
          ./target/conformance/mqtt5-conformance \
            --sut crates/mqtt5-conformance/tests/fixtures/mosquitto-2.x.toml \
            --report conformance-report-mosquitto.json \
            deferred_qos2

      - name: Mosquitto log
        if: always()
        run: cat mosquitto.log || true

      - name: Stop Mosquitto
        if: always()
        run: pkill -x mosquitto || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report-mosquitto
          path: conformance-report-mosquitto.json
          if-no-files-found: error

  fixtures:
    name: Validate fixtures and profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run schema unit tests
        run: cargo test -p mqtt5-conformance --lib --features inprocess-fixture
